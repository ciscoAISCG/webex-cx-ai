---
site_name: AI Agent Cookbook for WxCC
site_description: A practical guide for building secure, governed, and production-ready AI agents in WxCC
site_author: Chandramouli Vaithiyanathan
site_url: https://ciscoaiscg.github.io/webex-cx-ai/
docs_dir: docs
copyright: Copyright &copy; 2026 Cisco Systems Inc. All Rights Reserved.

theme:
  name: material
  logo: assets/cisco-logo.png
  favicon: assets/cisco-logo.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
    - content.tooltips
    - content.footnote.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: true
      caption_position: top

markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started.md
      - Architecture: architecture.md
      - Glossary: glossary.md
  - Agent Design:
      - Prompt Design: prompt-design.md
      - Scripted AI Agent Design: scripted-ai-agent-design.md
      - Multi-Agent Strategy: multi-agent-strategy.md
      - Agent2Agent: a2a.md
  - Knowledge and Tools:
      - Knowledge and RAG: knowledge-and-rag.md
      - Model Context Protocol: model-context-protocol.md
      - Pre-built AI Agent: agent-template.md
  - Quality and Operations:
      - Security: security.md
      - AI Agent Security FAQ: webex-ai-agent-security-faq.md
      - AI Quality Management: ai-quality-management-playbook.md
      - Testing and Evaluation: testing-and-evaluation.md
      - AI Assist Benefits: ai-assist-benefits3.md
      - Deployment and Operations: deployment-and-operations.md
      - Human Handoff: human-handoff.md
      - Governance: governance.md
      - Common Pitfalls: common-pitfalls.md
  - Explore AI SCG:
      - Plugins: plugins.md
      - Playbooks: playbooks.md
      - Skills: skills.md
      - MCP Factory: mcp-factory.md
