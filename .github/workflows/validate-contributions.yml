name: Validate SCG contributions

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "Plugins/**"
      - "Skills/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/validate_contributions.py"
      - "scripts/test_validate_contributions.py"
      - ".github/workflows/validate-contributions.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "Plugins/**"
      - "Skills/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/validate_contributions.py"
      - "scripts/test_validate_contributions.py"
      - ".github/workflows/validate-contributions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test contribution validator
        run: python3 -m unittest scripts/test_validate_contributions.py

      - name: Validate repository contributions
        run: python3 scripts/validate_contributions.py
