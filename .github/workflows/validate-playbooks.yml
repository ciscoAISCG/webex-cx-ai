name: Validate playbooks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate playbooks and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Cookbooks/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement Cookbooks/requirements.txt

      - name: Test FDE importer
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate playbook metadata
        run: python Plugins/scg-playbook/scripts/validate_playbook_metadata.py Playbooks

      - name: Regenerate catalog
        run: python scripts/generate_playbook_catalog.py

      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- \
            Playbooks/README.md \
            Cookbooks/docs/playbooks.md

      - name: Build website
        run: |
          mkdocs build \
            --strict \
            --config-file Cookbooks/mkdocs.yml \
            --site-dir "${RUNNER_TEMP}/site"
