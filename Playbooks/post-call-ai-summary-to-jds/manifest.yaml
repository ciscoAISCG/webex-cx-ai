    - wholesale-distribution
  channels:
    - voice
  features:
    - ai-assistant-real-time-transcript
    - ai-assistant-wrap-up-summary
  customer_journeys:
    - customer-service
  integrations:
    - jds
    - rest-api

complexity: intermediate
last_validated: "2026-10-06"

ownership:
  owner: dbokatov
  maintaining_team: fde-team

keywords:
  - post-call-summary
  - customer-journey-data
  - jds-event
  - flow-designer
  - wrap-up

artifacts:
  flows:
    - flows/PostCallSummary_toJDS_V3.json
    - screenshots/02-subflow-overview.png
    - screenshots/06-phone-contact-ended-mapping.png
  settings:
    - screenshots/03-jds-project-id.png
    - screenshots/04-subflows-list.png
    - screenshots/05-journey-projects.png
  samples:
    - screenshots/01-supervisor-jds-event.png
  tests: []

validation:
  environment: Webex Contact Center voice tenant with AI Assistant wrap-up summaries, Customer Journey Data, Flow Designer, and an authenticated HTTP connector.
