id: post-call-ai-summary-to-jds
date_added: "2026-10-06"
title: Post-Call AI Assistant Summary to Customer Journey Data
summary: Retrieve the completed voice interaction wrap-up summary and publish selected summary fields to a Webex Contact Center Customer Journey Data project.

classification:
