<svg width="1400" height="700" viewBox="0 0 1400 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="700" fill="#F6FAFF"/>
  <text x="40" y="70" fill="#1E2B5B" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Procedure-Guided AI Agent Pattern</text>
  <text x="40" y="112" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="24">The agent pulls the catalogue, determines the best-fit procedure, retrieves its guidance, then follows it to resolve the query.</text>

