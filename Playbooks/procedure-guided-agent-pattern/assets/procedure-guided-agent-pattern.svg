  <text x="984" y="282" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="16">Approved IDs and</text>
  <text x="984" y="303" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="16">selection guidance</text>

  <rect x="950" y="390" width="260" height="165" rx="24" fill="#FFFFFF" stroke="#B9D7F2" stroke-width="4"/>
  <rect x="1022" y="418" width="118" height="44" rx="12" fill="#EAF7F2" stroke="#88D39D" stroke-width="3"/>
  <rect x="1042" y="434" width="78" height="8" rx="4" fill="#2D8C3C"/>
  <text x="984" y="498" fill="#1E2B5B" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Procedure Guidance</text>
  <text x="984" y="522" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="16">Full steps for the</text>
  <text x="984" y="543" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="16">selected procedure ID</text>

  <rect x="640" y="500" width="250" height="150" rx="24" fill="#FFFFFF" stroke="#B9D7F2" stroke-width="4"/>
  <rect x="810" y="520" width="46" height="42" rx="10" fill="#EAF7F2" stroke="#88D39D" stroke-width="3"/>
