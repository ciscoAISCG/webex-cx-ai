  <text x="530" y="356" fill="#1E2B5B" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">AI Agent</text>
  <text x="530" y="383" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="15">1. Pulls the catalogue</text>
  <text x="530" y="402" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="15">2. Determines the procedure</text>
  <text x="530" y="421" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="13">3. Retrieves guidance and follows it</text>

