  <text x="84" y="418" fill="#5C6B82" font-family="Arial, Helvetica, sans-serif" font-size="20">States the request</text>

  <rect x="500" y="165" width="260" height="270" rx="26" fill="#E9F8F3" stroke="#6FCAB8" stroke-width="4"/>
