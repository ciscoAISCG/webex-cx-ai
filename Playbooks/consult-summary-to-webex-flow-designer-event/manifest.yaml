schema_version: 2
id: consult-summary-to-webex-flow-designer-event
title: Send Mid Call Consult Summaries to Webex Users with Flow Designer Event
summary: Use a Webex Contact Center PreDial event and Webex Connect to resolve a consulted Webex user and send that person the MID_CALL summary as a direct Webex message.

classification:
  channels:
    - voice
  features:
    - ai-assistant-dropped-call-and-transfer-summary
    - ai-assistant-real-time-transcript
  customer_journeys:
    - routing-transfer
  integrations:
    - rest-api
    - webhook

complexity: intermediate
last_validated: "2026-09-23"

ownership:
  owner: dbokatov
  maintaining_team: fde-team

keywords:
  - consult-transfer
  - mid-call-summary
  - flow-designer
  - predial-event
  - webex-connect
  - webex-messaging
  - ai-assistant-transfer-summary
  - ai-assistant-mid-call-summary

artifacts:
  flows:
    - assets/architecture.svg
    - assets/webex-connect-flow-sanitized.png
    - assets/predial-event-flow-sanitized.png
  settings:
    - assets/webex-integration-oauth-sanitized.png
    - assets/dn-check-custom-node-sanitized.png
    - assets/mid-call-summary-custom-node-sanitized.png
