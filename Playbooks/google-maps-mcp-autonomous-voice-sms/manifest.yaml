title: Implement Google Maps MCP and SMS Fulfillment in a Webex Autonomous Voice Agent
summary: Configure Google Maps MCP for location search and route estimates, then use a Webex Connect fulfillment flow to search Google Places and send a selected location link to a customer by SMS.

