artifacts:
  flows:
    - exports/95722.workflow
  settings:
    - exports/send-location-sms-action.png
  samples:
    - resources/Google Maps MCP and Location SMS Guide.docx
  tests: []

validation:
  environment: Webex Contact Center autonomous AI Agent and Webex Connect Flow Builder with Google Maps MCP, Places API (New), and an SMS sender configured.
  expected_result: The agent uses Google Maps MCP for location search and route estimates. After customer consent, the fulfillment flow searches Places, parses the results, normalizes the destination number, and sends a Google Maps place link by SMS.

